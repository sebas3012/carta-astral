<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carta Astral</title>
</head>
<body>
  <h1>Calculá tu carta astral</h1>
  <form>
    <label>Fecha de nacimiento <input type="date" id="fecha"></label>
    <label>Hora de nacimiento <input type="time" id="hora"></label>
    <label>Ciudad de nacimiento <input type="text" id="ciudad"></label>
    <button type="button">Calcular</button>
  </form>
</body>
</html>
